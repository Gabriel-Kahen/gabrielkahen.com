<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="description" content="Draw a little picture with a black pen. Your strokes become a drawing on paper.">
  <title>Draw · Gabriel Kahen</title>
  <link rel="preconnect" href="https://gabepi.tail0cb95e.ts.net:8443" crossorigin>
  <link rel="stylesheet" href="./style.css?v=5">
  <script src="./config.js" defer></script>
  <script src="./app.mjs?v=53" type="module"></script>
</head>
<body>
  <main>
    <header>
      <h1>Draw something.</h1>
    </header>
    <div class="paper-label" id="paper-label"><span>17.5 × 17.5 CM</span></div>
    <svg id="paper" viewBox="0 0 175 175" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Square drawing area, 17.5 by 17.5 centimeters. Draw with your mouse, finger, or pen." aria-describedby="drawing-help">
      <g id="strokes" fill="none" stroke="#000" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round"></g>
    </svg>
    <p id="drawing-help" class="visually-hidden">Drag on the paper to draw in black ink. Undo removes your last stroke. Drawings may use up to 48 inches of line.</p>
    <div class="toolbar">
      <button id="undo" class="secondary" type="button" disabled title="Undo last stroke (Ctrl or Command Z)"><span aria-hidden="true">↶</span> Undo</button>
      <span id="ink" aria-live="off">48.0 in left</span>
      <button id="submit" type="button" disabled>Submit drawing <span aria-hidden="true">↗</span></button>
      <button id="another" type="button" hidden>Draw another <span aria-hidden="true">↗</span></button>
    </div>
    <p id="status" role="status" aria-live="polite">Draw with your mouse, finger, or pen.</p>
    <noscript><p>JavaScript is needed to draw and submit a picture.</p></noscript>
  </main>
</body>
</html>
